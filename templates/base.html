{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Panel{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'app/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'app/css/layout.css' %}">
</head>
<body>

<div class="page-container">

    <!-- HEADER -->
    <header>
        <span>Dane logowania dostaniesz od HR</span>
        <a href="{% url 'login' %}" class="btn btn-primary">Zaloguj się</a>
    </header>

    <!-- MAIN AREA -->
    <div class="main-area">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h4 class="sidebar-title">Menu</h4>
            <a href="#" class="menu-btn">Dashboard</a>
            <a href="#" class="menu-btn">Użytkownicy</a>
            <a href="#" class="menu-btn">Raporty</a>
            <a href="#" class="menu-btn">Ustawienia</a>
        </aside>

        <!-- CONTENT -->
        <main class="content">
            {% block content %}
            {% endblock %}
        </main>

    </div>

</div>

<script src="{% static 'app/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
