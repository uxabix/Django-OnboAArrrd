{# Hidden fields so POST actions return to the same filtered/sorted page #}

<input type="hidden" name="filter_role" value="{{ preservation.filter_role }}">
<input type="hidden" name="created_from" value="{{ preservation.created_from }}">
<input type="hidden" name="created_to" value="{{ preservation.created_to }}">
<input type="hidden" name="sort" value="{{ preservation.sort }}">
<input type="hidden" name="page" value="{{ preservation.page }}">
