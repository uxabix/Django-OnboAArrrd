<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Logowanie</title>
</head>
<body>
  <h2>Logowanie</h2>
  {% if form.errors %}
    <p>Nieprawidłowe dane — spróbuj ponownie.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Zaloguj</button>
  </form>
</body>
</html>
