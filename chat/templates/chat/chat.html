<h1>Mój czat</h1>

{% if messages %}
    <ul>
    {% for message in messages %}
        <li>
            <strong>{{ message.sender.get_full_name|default:message.sender.email }}:</strong>
            {{ message.text }}
            <em>({{ message.sent_at }})</em>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>Brak wiadomości.</p>
{% endif %}

<p><a href="{% url 'accounts:home' %}">Powrót do strony głównej</a></p>
